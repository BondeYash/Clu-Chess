global:
  evaluation_interval: 15s
  scrape_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: cluchess
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/cluchess/metrics-token
    static_configs:
      - targets:
          - app-a:3000
          - app-b:3000
