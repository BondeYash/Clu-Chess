groups:
  - name: cluchess-runtime
    rules:
      - alert: CluChessEventLoopLagHigh
        expr: histogram_quantile(0.99, sum by (le, instance) (rate(nodejs_eventloop_lag_seconds_bucket[2m]))) > 0.07
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: CluChess event-loop p99 is above 70 ms
          runbook_url: https://github.com/BondeYash/Clu-Chess/blob/main/docs/observability-runbooks.md#event-loop-lag

      - alert: CluChessMoveLatencySloBreach
        expr: histogram_quantile(0.95, sum by (le) (rate(cluchess_move_latency_seconds_bucket[5m]))) > 0.1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: CluChess move p95 is above 100 ms
          runbook_url: https://github.com/BondeYash/Clu-Chess/blob/main/docs/observability-runbooks.md#move-latency

      - alert: CluChessMatchmakingStalled
        expr: max(cluchess_mm_queue_depth) > 1 and sum(rate(cluchess_matches_total[2m])) == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Matchmaking has queued guests but no committed matches
          runbook_url: https://github.com/BondeYash/Clu-Chess/blob/main/docs/observability-runbooks.md#matchmaking-stall

      - alert: CluChessDatabaseFailures
        expr: sum(rate(cluchess_pg_tx_failures_total[2m])) > 0.05
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: PostgreSQL transaction failures are sustained
          runbook_url: https://github.com/BondeYash/Clu-Chess/blob/main/docs/observability-runbooks.md#postgresql-failures

      - alert: CluChessRedisErrors
        expr: sum(rate(cluchess_redis_errors_total[2m])) > 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Redis errors are sustained
          runbook_url: https://github.com/BondeYash/Clu-Chess/blob/main/docs/observability-runbooks.md#redis-errors

      - alert: CluChessReconnectFailures
        expr: min(cluchess_reconnect_success_ratio) < 0.9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Reconnect success ratio is below 90 percent
          runbook_url: https://github.com/BondeYash/Clu-Chess/blob/main/docs/observability-runbooks.md#reconnect-failures

      - alert: CluChessCleanupFailing
        expr: sum(increase(cluchess_cleanup_failures_total[10m])) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: A cleanup or reconciliation job is failing
          runbook_url: https://github.com/BondeYash/Clu-Chess/blob/main/docs/observability-runbooks.md#cleanup-failures

      - alert: CluChessInstanceFlapping
        expr: sum by (instance) (increase(cluchess_process_restarts_total[1h])) > 2
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: A CluChess application instance is repeatedly restarting
          runbook_url: https://github.com/BondeYash/Clu-Chess/blob/main/docs/observability-runbooks.md#instance-flapping
