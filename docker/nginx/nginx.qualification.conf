worker_processes auto;

events {
  worker_connections 8192;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  limit_conn_zone $binary_remote_addr zone=cluchess_load_generator:10m;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  map $http_origin $socket_origin_allowed {
    default 0;
    ~^https://localhost(:[0-9]+)?$ 1;
    ~^https://127\.0\.0\.1(:[0-9]+)?$ 1;
  }

  map $cookie_cluchess_route $cluchess_route {
    '' $request_id;
    default $cookie_cluchess_route;
  }

  upstream cluchess_apps {
    hash $cluchess_route consistent;
    server app-a:3000 max_fails=2 fail_timeout=5s;
    server app-b:3000 max_fails=2 fail_timeout=5s;
    keepalive 128;
  }

  server {
    listen 8080;
    server_name _;

    location = /nginx_status {
      access_log off;
      stub_status;
    }

    location / {
      return 404;
    }
  }

  server {
    listen 443 ssl;
    server_name localhost;

    ssl_certificate /run/secrets/cluchess-edge/tls.crt;
    ssl_certificate_key /run/secrets/cluchess-edge/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 8k;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;

    location = /metrics {
      return 404;
    }

    location /socket.io/ {
      # Qualification generators share one container address. Production keeps
      # the stricter per-client limit in docker/nginx/nginx.conf.
      limit_conn cluchess_load_generator 5000;

      if ($socket_origin_allowed = 0) {
        return 403;
      }

      proxy_pass http://cluchess_apps;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header Origin $http_origin;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_buffering off;
      proxy_read_timeout 75s;
      proxy_send_timeout 75s;
      add_header Set-Cookie "cluchess_route=$cluchess_route; Path=/; Secure; HttpOnly; SameSite=Lax" always;
      add_header X-CluChess-Upstream $upstream_addr always;
    }

    location / {
      proxy_pass http://cluchess_apps;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_connect_timeout 2s;
      proxy_read_timeout 15s;
      add_header Set-Cookie "cluchess_route=$cluchess_route; Path=/; Secure; HttpOnly; SameSite=Lax" always;
      add_header X-CluChess-Upstream $upstream_addr always;
    }
  }
}
