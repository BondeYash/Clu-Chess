name: cluchess

services:
  postgres:
    image: postgres:16.9-alpine
    environment:
      POSTGRES_DB: cluchess
      POSTGRES_PASSWORD: cluchess_owner_dev
      POSTGRES_USER: cluchess_owner
      TZ: UTC
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cluchess_owner -d cluchess']
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7.4.5-alpine
    command: ['redis-server', '--appendonly', 'yes']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - redis-data:/data

  keygen:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: development
    command: ['node', 'scripts/generate-local-keys.mjs']
    environment:
      JWT_KID: local-dev-1
      KEY_OUTPUT_DIR: /run/secrets/cluchess
      KEY_OWNER_GID: '1000'
      KEY_OWNER_UID: '1000'
    user: '0:0'
    volumes:
      - jwt-keys:/run/secrets/cluchess

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: development
    command: ['npm', 'run', 'prisma:deploy']
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MIGRATION_DATABASE_URL: postgresql://cluchess_migrator:cluchess_migrator_dev@postgres:5432/cluchess?schema=public

  node-modules-init:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: development
    command:
      [
        'chown',
        '-R',
        'node:node',
        '/workspace/backend/node_modules',
        '/workspace/packages/protocol-v1/node_modules',
      ]
    user: '0:0'
    volumes:
      - app-node-modules:/workspace/backend/node_modules
      - protocol-node-modules:/workspace/packages/protocol-v1/node_modules

  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: development
    command:
      - sh
      - scripts/start-development.sh
    depends_on:
      keygen:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
      node-modules-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://cluchess_runtime:cluchess_runtime_dev@postgres:5432/cluchess?schema=public
      INSTANCE_ID: local-compose
      JWT_KID: local-dev-1
      JWT_PRIVATE_KEY_FILE: /run/secrets/cluchess/jwt-private.pem
      JWT_PUBLIC_KEYS_DIR: /run/secrets/cluchess/public
      LOG_LEVEL: debug
      NODE_ENV: development
      ORIGIN_ALLOWLIST: ${ORIGIN_ALLOWLIST:-http://localhost:5173}
      OTEL_ENABLED: 'false'
      PORT: '3000'
      REDIS_URL: redis://redis:6379
      TZ: UTC
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    ports:
      - '${APP_PORT:-3000}:3000'
    volumes:
      - ./backend:/workspace/backend
      - ./packages/protocol-v1:/workspace/packages/protocol-v1
      - app-node-modules:/workspace/backend/node_modules
      - protocol-node-modules:/workspace/packages/protocol-v1/node_modules
      - jwt-keys:/run/secrets/cluchess:ro

  web-node-modules-init:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: development
    command:
      [
        'chown',
        '-R',
        'node:node',
        '/workspace/frontend/.next',
        '/workspace/frontend/node_modules',
      ]
    user: '0:0'
    volumes:
      - frontend-next-cache:/workspace/frontend/.next
      - frontend-node-modules:/workspace/frontend/node_modules

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: development
    depends_on:
      app:
        condition: service_healthy
      web-node-modules-init:
        condition: service_completed_successfully
    environment:
      FRONTEND_DEPLOYMENT_ENV: local
      NEXT_PUBLIC_API_ORIGIN: ${FRONTEND_API_ORIGIN:-http://localhost:3000}
      NEXT_PUBLIC_APP_ORIGIN: ${FRONTEND_APP_ORIGIN:-http://localhost:5173}
      NEXT_PUBLIC_BUILD_SHA: local-compose
      NEXT_PUBLIC_ENABLE_DEVTOOLS: 'false'
      NEXT_PUBLIC_FF_FRONTEND_TELEMETRY: 'false'
      NEXT_PUBLIC_FF_LEARN_HUB: 'false'
      NEXT_PUBLIC_FF_LESSON_HERO_ART: 'false'
      NEXT_PUBLIC_FF_SOUND_EFFECTS: 'false'
      NEXT_PUBLIC_PROTOCOL_VERSION: '1'
      NEXT_PUBLIC_SOCKET_ORIGIN: ${FRONTEND_SOCKET_ORIGIN:-http://localhost:3000}
      NODE_ENV: development
      TZ: UTC
    ports:
      - '${WEB_PORT:-5173}:5173'
    volumes:
      - ./frontend:/workspace/frontend
      - frontend-next-cache:/workspace/frontend/.next
      - frontend-node-modules:/workspace/frontend/node_modules

volumes:
  app-node-modules:
  frontend-next-cache:
  frontend-node-modules:
  jwt-keys:
  postgres-data:
  protocol-node-modules:
  redis-data:
