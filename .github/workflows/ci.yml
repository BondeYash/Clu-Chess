name: Backend CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Lint, type, unit, build, and audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          cache: npm
          node-version-file: .node-version
      - run: npm ci
      - run: npm run prisma:validate
      - run: npm run verify
      - run: npm audit --audit-level=high

  integration:
    name: PostgreSQL and Redis integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16.9-alpine
        env:
          POSTGRES_DB: cluchess
          POSTGRES_PASSWORD: cluchess_dev
          POSTGRES_USER: cluchess
        options: >-
          --health-cmd "pg_isready -U cluchess -d cluchess"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
        ports:
          - 5432:5432
      redis:
        image: redis:7.4.5-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
        ports:
          - 6379:6379
    env:
      DATABASE_POOL_MAX: 5
      DATABASE_URL: postgresql://cluchess:cluchess_dev@localhost:5432/cluchess?schema=public
      INSTANCE_ID: ci
      JWT_KID: test-1
      LOG_LEVEL: silent
      NODE_ENV: test
      ORIGIN_ALLOWLIST: http://test.local
      OTEL_ENABLED: 'false'
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          cache: npm
          node-version-file: .node-version
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run prisma:deploy
      - run: npm run prisma:status
      - run: npm run test:integration

  container:
    name: Production container
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker build --target production --tag cluchess:${{ github.sha }} .
      - run: test "$(docker image inspect cluchess:${{ github.sha }} --format '{{.Config.User}}')" = "node"
