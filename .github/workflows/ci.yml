name: Backend CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Lint, type, unit, build, and audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          cache: npm
          node-version-file: .node-version
      - run: npm ci
      - run: npm run prisma:validate
      - run: npm run verify
      - run: npm audit --audit-level=high

  integration:
    name: PostgreSQL and Redis integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          cache: npm
          node-version-file: .node-version
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run test:integration

  container:
    name: Production container
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker build --target production --tag cluchess:${{ github.sha }} .
      - run: test "$(docker image inspect cluchess:${{ github.sha }} --format '{{.Config.User}}')" = "node"
      - run: docker run --rm --read-only --tmpfs /tmp:size=16m cluchess:${{ github.sha }} node --version

  multi-instance:
    name: Two-replica HTTPS and WSS smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: COMPOSE_PROGRESS=plain npm run test:multi:docker

  observability:
    name: Prometheus rules and observability manifests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npm run test:observability:docker

  security:
    name: Dependency, license, secret, and container scans
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: COMPOSE_PROGRESS=plain sh scripts/run-security-scans.sh cluchess:${{ github.sha }}
